<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -18 200 200" width="200" height="200">
  <title>VirtIOForge</title>
  <defs>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8661c"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <clipPath id="above" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="-18" width="200" height="71"/>
    </clipPath>
  </defs>
  <rect x="0" y="-18" width="200" height="200" fill="#0d1117"/>
  <!-- anvil -->
  <path fill="#8d97a6" d="M18 106 L150 106 Q176 106 182 92 L182 124 L142 124 Q128 126 126 138 L126 150 L152 166 L152 178 L48 178 L48 166 L74 150 L74 138 Q72 126 58 124 L46 124 Q26 122 18 106 Z"/>
  <path fill="#b7c0cc" d="M18 106 L150 106 Q176 106 182 92 L182 98 Q174 112 150 112 L30 112 Z"/>
  <!-- window block -->
  <g transform="translate(70 46) scale(1.3636)" fill="#3d93d6">
    <rect x="0" y="0" width="20" height="20" rx="2"/>
    <rect x="24" y="0" width="20" height="20" rx="2"/>
    <rect x="0" y="24" width="20" height="20" rx="2"/>
    <rect x="24" y="24" width="20" height="20" rx="2"/>
  </g>
  <!-- penguin, half hammered into the block -->
  <g clip-path="url(#above)">
    <g transform="translate(81 14.55) scale(0.8636)">
      <ellipse cx="22" cy="28" rx="19" ry="23" fill="#262d3a" stroke="#b7c0cc" stroke-width="1.5"/>
      <ellipse cx="22" cy="33" rx="12" ry="16" fill="#e9edf2"/>
      <circle cx="16" cy="15" r="3.2" fill="#e9edf2"/>
      <circle cx="28" cy="15" r="3.2" fill="#e9edf2"/>
      <circle cx="16.6" cy="15.4" r="1.5" fill="#262d3a"/>
      <circle cx="28.6" cy="15.4" r="1.5" fill="#262d3a"/>
      <path d="M18 21 L26 21 L22 27 Z" fill="#e8661c"/>
    </g>
  </g>
  <!-- impact -->
  <ellipse cx="100" cy="52" rx="19" ry="4.5" fill="url(#glow)"/>
  <g stroke="url(#glow)" stroke-width="4" stroke-linecap="round">
    <line x1="76" y1="50" x2="60" y2="44"/>
    <line x1="78" y1="42" x2="66" y2="30"/>
    <line x1="124" y1="50" x2="140" y2="44"/>
  </g>
  <!-- hammer -->
  <g transform="rotate(-30 128 22)">
    <rect x="124" y="18" width="58" height="7" rx="3" fill="#a87a4a"/>
    <rect x="116" y="4" width="16" height="34" rx="3" fill="#8d97a6"/>
  </g>
  <g stroke="#b7c0cc" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M150 4 Q160 14 158 28"/>
    <path d="M162 0 Q174 14 170 32"/>
  </g>
</svg>
